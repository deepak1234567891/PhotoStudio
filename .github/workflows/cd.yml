name: CD Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event.inputs.environment == 'staging'
    environment:
      name: staging
      url: http://${{ secrets.STAGING_SERVER_IP }}:3000
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install Ansible
      run: pip install ansible
    
    - name: Setup SSH key
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        ssh-keyscan -H ${{ secrets.STAGING_SERVER_IP }} >> ~/.ssh/known_hosts
    
    - name: Create Ansible inventory
      run: |
        cat > ansible/inventory/staging.ini << EOF
        [webservers]
        staging ansible_host=${{ secrets.STAGING_SERVER_IP }} ansible_user=${{ secrets.SERVER_USER }}
        
        [webservers:vars]
        ansible_python_interpreter=/usr/bin/python3
        ansible_ssh_private_key_file=~/.ssh/deploy_key
        EOF
    
    - name: Run minimal deployment
      run: |
        cd ansible
        ansible-playbook -i inventory/staging.ini playbooks/site-minimal.yml
    
    - name: Run health checks
      run: |
        # Wait for services to be ready
        sleep 30
        # Check frontend
        curl -f http://${{ secrets.STAGING_SERVER_IP }}:3000 || exit 1
        # Check backend
        curl -f http://${{ secrets.STAGING_SERVER_IP }}:8000/ || exit 1
    
    - name: Notify deployment success
      if: success()
      run: echo "Staging deployment successful"

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: github.event.inputs.environment == 'production'
    environment:
      name: production
      url: https://${{ secrets.DOMAIN_NAME }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install Ansible
      run: pip install ansible
    
    - name: Setup SSH key
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        ssh-keyscan -H ${{ secrets.PRODUCTION_SERVER_IP }} >> ~/.ssh/known_hosts
    
    - name: Create Ansible inventory
      run: |
        cat > ansible/inventory/production.ini << EOF
        [webservers]
        production ansible_host=${{ secrets.PRODUCTION_SERVER_IP }} ansible_user=${{ secrets.SERVER_USER }}
        
        [webservers:vars]
        ansible_python_interpreter=/usr/bin/python3
        ansible_ssh_private_key_file=~/.ssh/deploy_key
        EOF
    
    - name: Run complete deployment with SSL
      run: |
        cd ansible
        DOMAIN_NAME=${{ secrets.DOMAIN_NAME }} SSL_EMAIL=${{ secrets.SSL_EMAIL }} \
        ansible-playbook -i inventory/production.ini playbooks/site.yml
    
    - name: Run health checks
      run: |
        # Wait for services to be ready
        sleep 60
        # Check frontend with HTTPS
        curl -f https://${{ secrets.DOMAIN_NAME }}/ || exit 1
        # Check backend
        curl -f http://${{ secrets.PRODUCTION_SERVER_IP }}:8000/ || exit 1
    
    - name: Notify deployment success
      if: success()
      run: echo "Production deployment successful"
    
    - name: Create deployment tag
      if: success()
      run: |
        git tag -a "deploy-$(date +%Y%m%d-%H%M%S)" -m "Production deployment"
        git push origin --tags

  docker-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    
    - name: Extract metadata for backend
      id: meta-backend
      uses: docker/metadata-action@v4
      with:
        images: ${{ secrets.DOCKER_USERNAME }}/photostudio-backend
        tags: |
          type=ref,event=branch
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}
    
    - name: Build and push backend image
      uses: docker/build-push-action@v4
      with:
        context: ./backend
        push: true
        tags: ${{ steps.meta-backend.outputs.tags }}
        labels: ${{ steps.meta-backend.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Extract metadata for frontend
      id: meta-frontend
      uses: docker/metadata-action@v4
      with:
        images: ${{ secrets.DOCKER_USERNAME }}/photostudio-frontend
        tags: |
          type=ref,event=branch
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}
    
    - name: Build and push frontend image
      uses: docker/build-push-action@v4
      with:
        context: ./frontend
        push: true
        tags: ${{ steps.meta-frontend.outputs.tags }}
        labels: ${{ steps.meta-frontend.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  rollback:
    name: Rollback Deployment
    runs-on: ubuntu-latest
    if: failure() && github.event.inputs.environment == 'production'
    environment:
      name: production
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        ref: ${{ github.event.before }}
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install Ansible
      run: pip install ansible
    
    - name: Setup SSH key
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        ssh-keyscan -H ${{ secrets.PRODUCTION_SERVER_IP }} >> ~/.ssh/known_hosts
    
    - name: Create Ansible inventory
      run: |
        cat > ansible/inventory/production.ini << EOF
        [webservers]
        production ansible_host=${{ secrets.PRODUCTION_SERVER_IP }} ansible_user=${{ secrets.SERVER_USER }}
        
        [webservers:vars]
        ansible_python_interpreter=/usr/bin/python3
        ansible_ssh_private_key_file=~/.ssh/deploy_key
        EOF
    
    - name: Rollback deployment
      run: |
        cd ansible
        ansible-playbook -i inventory/production.ini playbooks/07-docker-compose.yml
    
    - name: Notify rollback
      run: echo "Rollback completed to previous version"
