---
- name: Ubuntu Server Setup
  hosts: webservers
  become: yes
  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Upgrade all packages
      apt:
        upgrade: dist
        update_cache: yes

    - name: Install essential packages
      apt:
        name:
          - curl
          - wget
          - unzip
          - software-properties-common
          - apt-transport-https
          - ca-certificates
          - gnupg
          - lsb-release
          - python3
          - python3-pip
          - python3-venv
          - build-essential
        state: present

    - name: Install Docker SDK for Python
      pip:
        name:
          - docker
          - docker-compose
        state: present

    - name: Set timezone to UTC
      timezone:
        name: UTC

    - name: Create application directory
      file:
        path: /opt/photostudio
        state: directory
        mode: '0755'

    - name: Create log directory
      file:
        path: /var/log/photostudio
        state: directory
        mode: '0755'

    - name: Ensure swap is disabled (Docker requirement)
      command: swapoff -a
      ignore_errors: yes

    - name: Remove swap entry from fstab
      lineinfile:
        path: /etc/fstab
        regexp: '.*swap.*'
        state: absent
