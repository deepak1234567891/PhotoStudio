---
- name: Docker Compose Startup/Update
  hosts: webservers
  become: yes
  vars:
    app_dir: /opt/photostudio

  tasks:
    - name: Pull latest Docker images
      shell: cd {{ app_dir }} && docker-compose pull
      ignore_errors: yes
    - name: Stop existing containers
      shell: cd {{ app_dir }} && docker-compose down
      ignore_errors: yes

    - name: Remove old containers and images
      shell: cd {{ app_dir }} && docker-compose down -v --remove-orphans
      ignore_errors: yes

    - name: Build and start Docker containers
      shell: cd {{ app_dir }} && docker-compose up -d --build --force-recreate

    - name: Wait for backend to be healthy
      wait_for:
        host: localhost
        port: 8000
        delay: 10
        timeout: 300
        state: started

    - name: Wait for frontend to be healthy
      wait_for:
        host: localhost
        port: 3000
        delay: 10
        timeout: 300
        state: started

    - name: Display container status
      command: docker ps --filter "name=photostudio"
      register: container_status
      changed_when: false

    - name: Show running containers
      debug:
        var: container_status.stdout_lines

    - name: Display deployment success message
      debug:
        msg: "PhotoStudio application successfully deployed and running!"
